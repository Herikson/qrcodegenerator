<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Code Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>QR Code Generator</h1>
      <p>Enter text, or upload an existing QR code to read, edit and regenerate it.</p>
    </header>

    <section class="controls upload" aria-labelledby="uploadTitle">
      <h2 id="uploadTitle">Read a QR code</h2>
      <div id="dropZone" class="dropZone" role="button" tabindex="0"
           aria-describedby="dropHint">
        <img id="uploadPreview" class="uploadPreview" alt="Uploaded image" hidden>
        <div>
          <strong>Upload an image</strong>
          <span id="dropHint">Click, drag &amp; drop, or paste (Ctrl+V) an image containing a QR code.</span>
        </div>
      </div>
      <input id="fileInput" type="file" accept="image/*" hidden>
    </section>

    <section class="controls" aria-labelledby="genTitle">
      <h2 id="genTitle">Generate</h2>
      <label class="field">
        <span>Text</span>
        <textarea id="textInput" rows="3" placeholder="Type text or URL" autocomplete="off"></textarea>
      </label>
      <div class="grid">
        <label class="field">
          <span>Size</span>
          <div class="range">
            <input id="sizeInput" type="range" min="128" max="1024" step="32" value="256">
            <output id="sizeValue">256 px</output>
          </div>
        </label>
        <label class="field">
          <span>Margin</span>
          <div class="range">
            <input id="marginInput" type="range" min="0" max="10" step="1" value="2">
            <output id="marginValue">2</output>
          </div>
        </label>
        <label class="field">
          <span>Error Correction</span>
          <select id="eclSelect">
            <option value="L">L (7%)</option>
            <option value="M" selected>M (15%)</option>
            <option value="Q">Q (25%)</option>
            <option value="H">H (30%)</option>
          </select>
        </label>
      </div>
      <div class="actions">
        <button id="generateBtn" class="primary">Generate</button>
        <button id="downloadBtn" disabled>Download PNG</button>
        <button id="copyBtn" disabled>Copy Image</button>
        <button id="clearBtn">Clear</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section class="preview">
      <div class="canvasWrap">
        <canvas id="qrCanvas" width="256" height="256" role="img" aria-label="No QR code generated"></canvas>
      </div>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
